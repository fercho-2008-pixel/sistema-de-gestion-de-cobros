<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar cliente</title>

    <link rel="stylesheet" href="regristros.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="formulario-pagina">

        <section class="formulario-tarjeta">

            <div class="formulario-encabezado">
                <span class="etiqueta">NUEVO REGISTRO</span>

                <h1>Registrar cliente</h1>

                <p>
                    Completa la información para agregar un nuevo cliente.
                </p>
            </div>

            <form id="formularioRegistroCliente">

                <div class="form-grid">

                    <div class="campo">
                        <label for="primer_nombre">
                            Primer nombre *
                        </label>
                        <input
                            type="text"
                            id="primer_nombre"
                            name="primer_nombre"
                            placeholder="Ej. Juan"
                            required
                            autocomplete="given-name"
                        >
                    </div>

                    <div class="campo">
                        <label for="segundo_nombre">
                            Segundo nombre *
                        </label>
                        <input
                            type="text"
                            id="segundo_nombre"
                            name="segundo_nombre"
                            placeholder="Ej. Fernando"
                            required
                            autocomplete="additional-name"
                        >
                    </div>

                    <div class="campo">
                        <label for="primer_apellido">
                            Primer apellido *
                        </label>
                        <input
                            type="text"
                            id="primer_apellido"
                            name="primer_apellido"
                            placeholder="Ej. Pérez"
                            required
                            autocomplete="family-name"
                        >
                    </div>

                    <div class="campo">
                        <label for="segundo_apellido">
                            Segundo apellido *
                        </label>
                        <input
                            type="text"
                            id="segundo_apellido"
                            name="segundo_apellido"
                            placeholder="Ej. Gómez"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="cliente@correo.com"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefono">
                            Teléfono
                        </label>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="+57 300 000 0000"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="documento">
                            Número de documento
                        </label>

                        <input
                            type="text"
                            id="documento"
                            name="documento"
                            placeholder="Ej. 1.000.000.000"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="situacion_laboral">
                            Situación del cliente *
                        </label>

                        <select
                            id="situacion_laboral"
                            name="situacion_laboral"
                            required
                        >
                            <option value="">Selecciona situación laboral</option>
                            <option value="Laburando">Laburando (Empleado / Con trabajo)</option>
                            <option value="Desempleado">Desempleado (Sin empleo actual)</option>
                        </select>
                    </div>

                    <div class="campo campo-completo">
                        <label for="direccion">
                            Dirección
                        </label>

                        <input
                            type="text"
                            id="direccion"
                            name="direccion"
                            placeholder="Ej. Calle 10 # 20-30"
                        >
                    </div>

                    <div class="campo">
                        <label for="monto_prestamo_format">
                            Monto inicial / Préstamo (COP)
                        </label>

                        <div style="position:relative; display:flex; align-items:center;">
                            <span style="position:absolute; left:12px; color:#64748b; font-weight:700; pointer-events:none;">$</span>
                            <input
                                type="text"
                                id="monto_prestamo_format"
                                placeholder="0"
                                inputmode="numeric"
                                style="padding-left:28px;"
                            >
                        </div>
                        <input type="hidden" id="monto_deuda" name="monto_deuda" value="0">
                    </div>

                    <div class="campo">
                        <label for="porcentaje_interes">
                            Tasa de Interés (%)
                        </label>

                        <div style="position:relative; display:flex; align-items:center;">
                            <input
                                type="number"
                                id="porcentaje_interes"
                                name="porcentaje_interes"
                                placeholder="Ej. 10"
                                min="0"
                                max="100"
                                step="0.5"
                                value="0"
                                style="padding-right:32px;"
                            >
                            <span style="position:absolute; right:12px; color:#64748b; font-weight:700; pointer-events:none;">%</span>
                        </div>
                    </div>

                    <!-- Panel de cálculo y total automático con intereses -->
                    <div class="campo campo-completo" style="background:#f8fafc; border:1px solid #cbd5e1; border-left:4px solid #2563eb; border-radius:10px; padding:14px 16px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                            <div>
                                <span style="display:block; font-size:0.75rem; color:#64748b; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;">Intereses calculados:</span>
                                <strong id="lblInteresCalculado" style="font-size:0.95rem; color:#dc2626;">$0 COP</strong>
                            </div>
                            <div style="text-align:right;">
                                <span style="display:block; font-size:0.75rem; color:#1e40af; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Monto total a pagar (Capital + Intereses):</span>
                                <strong id="lblTotalConIntereses" style="font-size:1.25rem; color:#0f172a; font-weight:800;">$0 COP</strong>
                            </div>
                        </div>
                    </div>

                    <div class="campo campo-completo">
                        <label for="observaciones">
                            Observaciones
                        </label>

                        <textarea
                            id="observaciones"
                            name="observaciones"
                            rows="4"
                            placeholder="Escribe información adicional del cliente..."
                        ></textarea>
                    </div>

                </div>

                <div class="formulario-acciones">

                    <button
                        type="reset"
                        class="btn-secundario"
                    >
                        Limpiar
                    </button>

                    <button
                        type="submit"
                        id="btnGuardar"
                        class="btn-principal"
                    >
                        Guardar cliente
                    </button>
                    

                </div>

            </form>

            <div
                id="mensajeGuardado"
                class="mensaje-guardado"
                aria-live="polite"
                style="display:none; margin-top:16px; padding:12px 16px; border-radius:8px; font-size:14px; line-height:1.4;"
            ></div>
        </section>
    </main>

    <div style="text-align: center; margin: 20px auto 40px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <a href="menu2.html" style="text-decoration:none;">
          <button class="btn-principal" style="background:#0F2749;">
            ← Volver al panel principal
          </button>
        </a>
        <a href="clientes.html" id="linkDirectorioClientes" style="text-decoration:none;">
          <button class="btn-principal" style="background:#2563eb;">
            👥 Directorio de clientes
          </button>
        </a>
    </div>

    <!-- Script de integración con Supabase -->
    <script type="module">
        import { registrarCliente, verificarAutenticacion, esUsuarioAdmin } from './supabase.js';

        // Verificar si el usuario terminó de registrarse o inició sesión
        const auth = verificarAutenticacion({ redirigir: true, returnUrl: 'registros.html' });
        if (!auth.autenticado) {
            document.body.style.display = 'none';
        }

        // Ocultar directorio de clientes si el usuario es Cobrador
        const esAdmin = esUsuarioAdmin(auth.usuario);
        const linkDir = document.getElementById('linkDirectorioClientes');
        if (!esAdmin && linkDir) {
            linkDir.style.display = 'none';
        }

        const formulario = document.getElementById("formularioRegistroCliente");
        const mensaje = document.getElementById("mensajeGuardado");
        const btnGuardar = document.getElementById("btnGuardar");

        const selectSituacion = document.getElementById("situacion_laboral");
        const txtObservaciones = document.getElementById("observaciones");
        const inputMontoFormat = document.getElementById("monto_prestamo_format");
        const inputMontoHidden = document.getElementById("monto_deuda");
        const inputInteres = document.getElementById("porcentaje_interes");
        const lblInteres = document.getElementById("lblInteresCalculado");
        const lblTotal = document.getElementById("lblTotalConIntereses");

        // Formateador estándar de pesos colombianos (COP con separador de miles '.')
        function formatearMilesCOP(valor) {
            const soloDigitos = String(valor || '').replace(/\D/g, '');
            if (!soloDigitos) return '';
            return Number(soloDigitos).toLocaleString('es-CO');
        }

        function obtenerNumeroLimpio(valorStr) {
            const soloDigitos = String(valorStr || '').replace(/\D/g, '');
            return Number(soloDigitos) || 0;
        }

        // Actualizar automáticamente observaciones al cambiar situación del cliente
        selectSituacion.addEventListener("change", function () {
            const opcion = selectSituacion.value;
            let actual = txtObservaciones.value;

            // Limpiar menciones previas de situación laboral
            actual = actual.replace(/Situación laboral:\s*(Laburando|Desempleado)[^.\n]*[.\n]?/gi, '').trim();

            if (opcion === "Laburando") {
                const nota = "Situación laboral: Laburando (Cliente activo laboralmente).";
                txtObservaciones.value = actual ? `${actual}\n${nota}` : nota;
            } else if (opcion === "Desempleado") {
                const nota = "Situación laboral: Desempleado (Cliente actualmente sin empleo).";
                txtObservaciones.value = actual ? `${actual}\n${nota}` : nota;
            } else {
                txtObservaciones.value = actual;
            }
        });

        // Cálculo dinámico de intereses y total con formato COP en vivo
        function recalcularMontosEIntereses() {
            const capital = obtenerNumeroLimpio(inputMontoFormat.value);
            const tasa = parseFloat(inputInteres.value) || 0;

            const interesCalculado = Math.round(capital * (tasa / 100));
            const totalConIntereses = capital + interesCalculado;

            // Guardar total en campo oculto para el registro de la deuda del cliente
            inputMontoHidden.value = totalConIntereses;

            // Actualizar etiquetas visuales con formato de moneda de Colombia
            lblInteres.textContent = `$${interesCalculado.toLocaleString('es-CO')} COP (${tasa}%)`;
            lblTotal.textContent = `$${totalConIntereses.toLocaleString('es-CO')} COP`;
        }

        // Formatear automáticamente con puntos de miles al escribir el monto
        inputMontoFormat.addEventListener("input", function (e) {
            const cursorPos = this.selectionStart;
            const lenAntes = this.value.length;

            const formateado = formatearMilesCOP(this.value);
            this.value = formateado;

            // Mantener cursor en posición coherente tras formatear
            const diff = this.value.length - lenAntes;
            if (cursorPos !== null) {
                this.setSelectionRange(cursorPos + diff, cursorPos + diff);
            }

            recalcularMontosEIntereses();
        });

        inputInteres.addEventListener("input", recalcularMontosEIntereses);

        function mostrarMensaje(texto, esError = false) {
            mensaje.textContent = texto;
            mensaje.style.display = "block";
            if (esError) {
                mensaje.style.backgroundColor = "#fee2e2";
                mensaje.style.color = "#991b1b";
                mensaje.style.border = "1px solid #f87171";
            } else {
                mensaje.style.backgroundColor = "#dcfce7";
                mensaje.style.color = "#166534";
                mensaje.style.border = "1px solid #86efac";
            }
        }

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            const pNombre = document.getElementById("primer_nombre").value.trim();
            const sNombre = document.getElementById("segundo_nombre").value.trim();
            const pApellido = document.getElementById("primer_apellido").value.trim();
            const sApellido = document.getElementById("segundo_apellido").value.trim();
            const situacion = selectSituacion.value;

            if (!pNombre || !sNombre || !pApellido || !sApellido) {
                mostrarMensaje("Los dos nombres y los dos apellidos son campos obligatorios.", true);
                return;
            }

            if (!situacion) {
                mostrarMensaje("Por favor selecciona la situación del cliente (Laburando o Desempleado).", true);
                return;
            }

            const capital = obtenerNumeroLimpio(inputMontoFormat.value);
            const tasa = parseFloat(inputInteres.value) || 0;
            const interesCalculado = Math.round(capital * (tasa / 100));
            const totalConIntereses = capital + interesCalculado;

            const nombreCompleto = `${pNombre} ${sNombre} ${pApellido} ${sApellido}`.replace(/\s+/g, ' ').trim();

            const datos = {
                nombre: nombreCompleto,
                primer_nombre: pNombre,
                segundo_nombre: sNombre,
                primer_apellido: pApellido,
                segundo_apellido: sApellido,
                correo: document.getElementById("correo").value.trim(),
                telefono: document.getElementById("telefono").value.trim(),
                documento: document.getElementById("documento").value.trim(),
                estado: situacion === "Laburando" ? "Activo" : "Pendiente",
                situacion_laboral: situacion,
                tasa_interes: tasa,
                monto_capital: capital,
                monto_interes: interesCalculado,
                direccion: document.getElementById("direccion").value.trim(),
                observaciones: txtObservaciones.value.trim(),
                monto_deuda: totalConIntereses
            };

            btnGuardar.disabled = true;
            btnGuardar.textContent = "Guardando cliente...";
            mensaje.style.display = "none";

            try {
                const clienteGuardado = await registrarCliente(datos);
                mostrarMensaje(`¡Éxito! Cliente "${clienteGuardado.nombre}" guardado con total de $${totalConIntereses.toLocaleString('es-CO')} COP en el sistema.`, false);
                formulario.reset();
                inputMontoHidden.value = "0";
                lblInteres.textContent = "$0 COP";
                lblTotal.textContent = "$0 COP";
            } catch (error) {
                console.error("Error al registrar cliente:", error);
                let msg = error.message || "Error al conectar con la base de datos.";
                if (msg.includes("Could not find the table") || msg.includes("schema cache")) {
                    msg = "La tabla de clientes aún no existe en la base de datos. Por favor ejecuta el script 'schema.sql' en tu base de datos.";
                } else if (msg.includes("violates row-level security") || error.code === "42501") {
                    msg = "Error de permisos de base de datos: Asegúrate de habilitar las políticas de inserción ejecutando el archivo 'schema.sql'.";
                } else if (msg.includes("duplicate key") || msg.includes("unique constraint")) {
                    msg = "Ya existe un cliente registrado con ese número de documento / cédula.";
                }
                mostrarMensaje(msg, true);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Guardar cliente";
            }
        });
    </script>

</body>
</html>

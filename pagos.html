<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo de Pagos - Sistema de Cobros</title>
<link rel="stylesheet" href="pagos.css">
<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .badge-success {
    background: #dcfce7;
    color: #166534;
    padding: 4px 10px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
  }
  .notification {
    margin-top: 15px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
  }
  .notification-success {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
  }
  .notification-error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #f87171;
  }
</style>
</head>

<body>

<div class="main">

    <div class="top">
        <div>
            <h1>Registrar Pago</h1>
            <p>Sistema de Gestión de Cobros / Registro de Recibos</p>
        </div>

        <div class="code" id="codigoPago">
            #PG-2048
        </div>
    </div>

    <form id="formPago">
      <div class="grid">

        <!-- FORMULARIO -->
        <div class="card">

            <h2>Información del cliente y pago</h2>

            <div class="form">

                <div class="group full" id="cajaFacturaCliente" style="display:none; background:#eff6ff; border:1px solid #bfdbfe; border-left:4px solid #2563eb; border-radius:8px; padding:10px 14px; margin-bottom:8px;">
                    <span style="font-size:0.75rem; color:#1e40af; font-weight:700; text-transform:uppercase;">Nº Factura del Cliente:</span>
                    <strong id="lblFacturaCliente" style="font-family:monospace; color:#1d4ed8; font-size:1.05rem; margin-left:8px;">-</strong>
                </div>

                <div class="group">
                    <label for="clienteNombre">Nombre del Cliente *</label>
                    <input type="text" id="clienteNombre" list="listaClientes" placeholder="Seleccionar o escribir..." required autocomplete="off">
                    <datalist id="listaClientes"></datalist>
                </div>

                <div class="group">
                    <label for="documento">Cédula / Documento *</label>
                    <input type="text" id="documento" placeholder="Ej: 1020304050" required>
                </div>

                <div class="group">
                    <label for="monto">Monto a pagar (COP) *</label>
                    <input type="number" id="monto" placeholder="0" min="1" step="any" required>
                </div>

                <div class="group">
                    <label for="fecha">Fecha de Pago</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="group">
                    <label for="metodoPago">Método de pago</label>
                    <select id="metodoPago">
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia</option>
                        <option value="Tarjeta">Tarjeta</option>
                        <option value="Nequi/Daviplata">Nequi / Daviplata</option>
                    </select>
                </div>

                <div class="group">
                    <label for="referencia">Referencia / Comprobante</label>
                    <input type="text" id="referencia" placeholder="TRX-984521">
                </div>

                <div class="group full">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" rows="3" placeholder="Detalle del cobro o comprobante..."></textarea>
                </div>

            </div>

        </div>

        <!-- RESUMEN -->
        <div class="summary">

            <h3>Resumen</h3>

            <div class="line">
                <span>Saldo pendiente actual</span>
                <strong id="saldoPendienteTexto">$0 COP</strong>
            </div>

            <div class="line">
                <span>Saldo posterior</span>
                <strong id="saldoPosteriorTexto" style="color:#2563eb;">$0 COP</strong>
            </div>

            <div class="line">
                <span>Estado</span>
                <span class="status" id="estadoPagoBadge">Listo para registrar</span>
            </div>

            <button type="submit" class="save" id="btnGuardarPago">
                Guardar pago
            </button>

            <a href="menu2.html" style="text-decoration:none; display:block;">
              <button type="button" class="back" style="width:100%;">
                  ← Ir al panel principal
              </button>
            </a>

            <div id="mensajePago" class="notification" style="display:none;"></div>

        </div>

      </div>
    </form>

    <div style="text-align: center; margin: 24px auto 30px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <a href="menu2.html" style="text-decoration:none;">
          <button type="button" class="btn" style="background:#0F2749; color:#fff; border:none; padding:10px 22px; border-radius:8px; font-weight:600; cursor:pointer;">
            ← Volver al panel principal
          </button>
        </a>
        <a href="clientes.html" id="linkDirectorioClientes" style="text-decoration:none;">
          <button type="button" class="btn" style="background:#2563eb; color:#fff; border:none; padding:10px 22px; border-radius:8px; font-weight:600; cursor:pointer;">
            👥 Directorio de clientes
          </button>
        </a>
    </div>

</div>

<script type="module">
    import { registrarPago, obtenerClientes, buscarClientePorDocumento, verificarAutenticacion, esUsuarioAdmin } from './supabase.js';

    // Verificar si el usuario completó su registro o inició sesión
    const auth = verificarAutenticacion({ redirigir: true, returnUrl: 'pagos.html' });
    if (!auth.autenticado) {
        document.body.style.display = 'none';
    }

    // Ocultar directorio de clientes para Cobrador
    const esAdmin = esUsuarioAdmin(auth.usuario);
    const linkDir = document.getElementById('linkDirectorioClientes');
    if (!esAdmin && linkDir) {
        linkDir.style.display = 'none';
    }

    // Generar código aleatorio de recibo
    const codigoAleatorio = `#PG-${Math.floor(1000 + Math.random() * 9000)}`;
    document.getElementById('codigoPago').textContent = codigoAleatorio;

    // Fecha actual por defecto
    const fechaInput = document.getElementById('fecha');
    fechaInput.value = new Date().toISOString().split('T')[0];

    // Elementos
    const formPago = document.getElementById('formPago');
    const inputNombre = document.getElementById('clienteNombre');
    const inputDocumento = document.getElementById('documento');
    const inputMonto = document.getElementById('monto');
    const saldoPendienteTexto = document.getElementById('saldoPendienteTexto');
    const saldoPosteriorTexto = document.getElementById('saldoPosteriorTexto');
    const estadoBadge = document.getElementById('estadoPagoBadge');
    const btnGuardar = document.getElementById('btnGuardarPago');
    const mensajePago = document.getElementById('mensajePago');
    const datalist = document.getElementById('listaClientes');

    let clientesCargados = [];
    let deudaActual = 0;

    // Cargar lista de clientes desde Supabase para autocompletar
    async function cargarClientes() {
      try {
        clientesCargados = await obtenerClientes();
        datalist.innerHTML = '';
        clientesCargados.forEach(c => {
          const option = document.createElement('option');
          option.value = c.nombre;
          option.label = `Doc: ${c.documento} (Deuda: $${Number(c.monto_deuda || 0).toLocaleString('es-CO')})`;
          datalist.appendChild(option);
        });
      } catch (err) {
        console.warn('No se pudieron cargar clientes para autocompletado:', err.message);
      }
    }
    cargarClientes();

    // Comprobar parámetros en URL (?documento=...&nombre=...)
    const params = new URLSearchParams(window.location.search);
    if (params.get('documento')) {
      inputDocumento.value = params.get('documento');
      if (params.get('nombre')) inputNombre.value = params.get('nombre');
      verificarCliente(params.get('documento'));
    }

    const cajaFactura = document.getElementById('cajaFacturaCliente');
    const lblFactura = document.getElementById('lblFacturaCliente');

    function mostrarFacturaCliente(numeroFactura) {
      if (numeroFactura && cajaFactura && lblFactura) {
        lblFactura.textContent = numeroFactura;
        cajaFactura.style.display = 'block';
      }
    }

    // Auto-completar documento al seleccionar nombre
    inputNombre.addEventListener('change', () => {
      const match = clientesCargados.find(c => c.nombre.toLowerCase() === inputNombre.value.trim().toLowerCase());
      if (match) {
        inputDocumento.value = match.documento;
        deudaActual = Number(match.monto_deuda) || 0;
        mostrarFacturaCliente(match.numero_factura);
        actualizarResumen();
      }
    });

    // Buscar deuda cuando cambie el documento
    inputDocumento.addEventListener('blur', () => {
      if (inputDocumento.value.trim()) {
        verificarCliente(inputDocumento.value.trim());
      }
    });

    async function verificarCliente(doc) {
      try {
        const cliente = await buscarClientePorDocumento(doc);
        if (cliente) {
          if (!inputNombre.value) inputNombre.value = cliente.nombre;
          deudaActual = Number(cliente.monto_deuda) || 0;
          mostrarFacturaCliente(cliente.numero_factura);
          actualizarResumen();
        }
      } catch (e) {
        console.warn('Error al verificar cliente:', e.message);
      }
    }

    // Actualizar cálculo de saldo posterior
    inputMonto.addEventListener('input', actualizarResumen);

    function actualizarResumen() {
      saldoPendienteTexto.textContent = `$${deudaActual.toLocaleString('es-CO')} COP`;
      const montoIngresado = Number(inputMonto.value) || 0;
      const nuevoSaldo = Math.max(0, deudaActual - montoIngresado);
      saldoPosteriorTexto.textContent = `$${nuevoSaldo.toLocaleString('es-CO')} COP`;
      
      if (montoIngresado > 0) {
        estadoBadge.textContent = "Pagando";
        estadoBadge.style.color = "#2563eb";
      } else {
        estadoBadge.textContent = "Listo para registrar";
        estadoBadge.style.color = "#6b7280";
      }
    }

    // Enviar pago a Supabase
    formPago.addEventListener('submit', async (e) => {
      e.preventDefault();

      const pagoData = {
        cliente_nombre: inputNombre.value.trim(),
        documento: inputDocumento.value.trim(),
        monto: Number(inputMonto.value) || 0,
        fecha: fechaInput.value,
        metodo_pago: document.getElementById('metodoPago').value,
        referencia: document.getElementById('referencia').value.trim() || codigoAleatorio,
        observaciones: document.getElementById('observaciones').value.trim(),
        estado: 'Pagado'
      };

      btnGuardar.disabled = true;
      btnGuardar.textContent = 'Guardando pago...';
      mensajePago.style.display = 'none';

      try {
        await registrarPago(pagoData);

        mensajePago.className = 'notification notification-success';
        mensajePago.style.display = 'block';
        mensajePago.innerHTML = `¡Pago de <strong>$${pagoData.monto.toLocaleString('es-CO')} COP</strong> registrado exitosamente en el sistema!<br><small>Referencia: ${pagoData.referencia}</small>`;

        // Actualizar deuda local
        deudaActual = Math.max(0, deudaActual - pagoData.monto);
        actualizarResumen();

        // Limpiar campos de pago
        inputMonto.value = '';
        document.getElementById('referencia').value = '';
        document.getElementById('observaciones').value = '';
        
        // Refrescar lista clientes
        cargarClientes();
      } catch (err) {
        console.error('Error al registrar pago:', err);
        mensajePago.className = 'notification notification-error';
        mensajePago.style.display = 'block';
        if (err.message && err.message.includes('schema cache')) {
          mensajePago.innerHTML = "La tabla de pagos aún no está lista en la base de datos. Ejecuta el archivo <code>schema.sql</code> en tu base de datos.";
        } else {
          mensajePago.textContent = 'Error al registrar pago: ' + (err.message || err);
        }
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = 'Guardar pago';
      }
    });
</script>

</body>
</html>

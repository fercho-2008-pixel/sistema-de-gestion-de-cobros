<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar cliente</title>

    <link rel="stylesheet" href="regristros.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <main class="formulario-pagina">

        <section class="formulario-tarjeta">

            <div class="formulario-encabezado">
                <span class="etiqueta">NUEVO REGISTRO</span>

                <h1>Registrar cliente</h1>

                <p>
                    Completa la información para agregar un nuevo cliente.
                </p>
            </div>

            <form id="formularioRegistroCliente">

                <div class="form-grid">

                    <div class="campo campo-completo">
                        <label for="nombre">
                            Nombre completo
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ej. María González"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="cliente@correo.com"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="telefono">
                            Teléfono
                        </label>

                        <input
                            type="tel"
                            id="telefono"
                            name="telefono"
                            placeholder="+57 300 000 0000"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="documento">
                            Número de documento
                        </label>

                        <input
                            type="text"
                            id="documento"
                            name="documento"
                            placeholder="Ej. 1.000.000.000"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="estado">
                            Estado del cliente
                        </label>

                        <select
                            id="estado"
                            name="estado"
                            required
                        >
                            <option value="">Selecciona una opción</option>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>

                    <div class="campo campo-completo">
                        <label for="direccion">
                            Dirección
                        </label>

                        <input
                            type="text"
                            id="direccion"
                            name="direccion"
                            placeholder="Ej. Calle 10 # 20-30"
                        >
                    </div>

                    <div class="campo">
                        <label for="monto_deuda">
                            Monto inicial / Préstamo (COP)
                        </label>

                        <input
                            type="number"
                            id="monto_deuda"
                            name="monto_deuda"
                            placeholder="0"
                            min="0"
                            value="0"
                        >
                    </div>

                    <div class="campo campo-completo">
                        <label for="observaciones">
                            Observaciones
                        </label>

                        <textarea
                            id="observaciones"
                            name="observaciones"
                            rows="4"
                            placeholder="Escribe información adicional del cliente..."
                        ></textarea>
                    </div>

                </div>

                <div class="formulario-acciones">

                    <button
                        type="reset"
                        class="btn-secundario"
                    >
                        Limpiar
                    </button>

                    <button
                        type="submit"
                        id="btnGuardar"
                        class="btn-principal"
                    >
                        Guardar cliente
                    </button>
                    

                </div>

            </form>

            <div
                id="mensajeGuardado"
                class="mensaje-guardado"
                aria-live="polite"
                style="display:none; margin-top:16px; padding:12px 16px; border-radius:8px; font-size:14px; line-height:1.4;"
            ></div>
        </section>
    </main>

    <div style="text-align: center; margin: 20px auto 40px;">
        <a href="menu2.html" style="text-decoration:none;">
          <button class="btn-principal" style="background:#0F2749;">
            ← Volver al panel principal
          </button>
        </a>
    </div>

    <!-- Script de integración con Supabase -->
    <script type="module">
        import { registrarCliente } from './supabase.js';

        const formulario = document.getElementById("formularioRegistroCliente");
        const mensaje = document.getElementById("mensajeGuardado");
        const btnGuardar = document.getElementById("btnGuardar");

        function mostrarMensaje(texto, esError = false) {
            mensaje.textContent = texto;
            mensaje.style.display = "block";
            if (esError) {
                mensaje.style.backgroundColor = "#fee2e2";
                mensaje.style.color = "#991b1b";
                mensaje.style.border = "1px solid #f87171";
            } else {
                mensaje.style.backgroundColor = "#dcfce7";
                mensaje.style.color = "#166534";
                mensaje.style.border = "1px solid #86efac";
            }
        }

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            const datos = {
                nombre: document.getElementById("nombre").value,
                correo: document.getElementById("correo").value,
                telefono: document.getElementById("telefono").value,
                documento: document.getElementById("documento").value,
                estado: document.getElementById("estado").value,
                direccion: document.getElementById("direccion").value,
                observaciones: document.getElementById("observaciones").value,
                monto_deuda: document.getElementById("monto_deuda").value || 0
            };

            btnGuardar.disabled = true;
            btnGuardar.textContent = "Guardando en Supabase...";
            mensaje.style.display = "none";

            try {
                const clienteGuardado = await registrarCliente(datos);
                mostrarMensaje(`¡Éxito! Cliente "${clienteGuardado.nombre}" guardado correctamente en la base de datos de Supabase.`, false);
                formulario.reset();
            } catch (error) {
                console.error("Error al registrar cliente:", error);
                let msg = error.message || "Error al conectar con Supabase.";
                if (msg.includes("Could not find the table") || msg.includes("schema cache")) {
                    msg = "La tabla 'clientes' no existe aún en tu base de datos de Supabase. Por favor copia y ejecuta el script 'schema.sql' en el Editor SQL de tu proyecto en Supabase.";
                } else if (msg.includes("violates row-level security") || error.code === "42501") {
                    msg = "Error de permisos RLS en Supabase: Asegúrate de habilitar las políticas de inserción ejecutando el archivo 'schema.sql'.";
                } else if (msg.includes("duplicate key") || msg.includes("unique constraint")) {
                    msg = "Ya existe un cliente registrado con ese número de documento / cédula.";
                }
                mostrarMensaje(msg, true);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = "Guardar cliente";
            }
        });
    </script>

</body>
</html>

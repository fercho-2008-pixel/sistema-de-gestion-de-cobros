<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Cliente - Sistema de Cobros</title>
  <link rel="stylesheet" href="estiloconsulta.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .badge-active {
      background: #dcfce7;
      color: #166534;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-inactive {
      background: #fee2e2;
      color: #991b1b;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .quick-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-pay {
      background: #2563eb;
      color: white;
    }
    .btn-pay:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card" style="max-width: 480px;">
    
    <a href="menu2.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Panel principal
    </a>

    <div class="card-header">
      <h2 class="card-title">Consulta de Cliente</h2>
      <p class="card-subtitle">Ingresa el número de cédula o documento registrado en el sistema.</p>
    </div>

    <form id="searchForm">
      <div class="form-group">
        <label for="cedula">Cédula o Documento de Identidad</label>
        <input type="text" id="cedula" placeholder="Ej: 1020304050" required autocomplete="off">
      </div>

      <button type="submit" id="btnBuscar" class="btn-search">
        <span id="btnBuscarTexto">Buscar cliente</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>

    <!-- Estado de Carga o Mensajes -->
    <div id="mensajeEstado" style="display:none; margin-top:16px; padding:12px 14px; border-radius:8px; font-size:14px;"></div>

    <!-- Resultado de Búsqueda -->
    <div id="resultado" class="result-container" style="display:none; margin-top:20px;">
      <div class="result-item">
        <span class="result-label">Nombre del Cliente</span>
        <span id="nombreCliente" class="result-value">-</span>
      </div>

      <div class="result-item">
        <span class="result-label">Documento</span>
        <span id="documentoCliente" class="result-value">-</span>
      </div>

      <div class="result-item">
        <span class="result-label">Estado</span>
        <span id="estadoCliente" class="result-value">-</span>
      </div>

      <div class="result-item">
        <span class="result-label">Teléfono</span>
        <span id="telefonoCliente" class="result-value">-</span>
      </div>

      <div class="result-item">
        <span class="result-label">Saldo Pendiente / Deuda</span>
        <span id="deudaCliente" class="result-value debt">$0 COP</span>
      </div>

      <div id="seccionHistorial" style="margin-top:14px; padding-top:10px; border-top:1px solid #334155; font-size:13px; color:#94a3b8;">
        <span style="font-weight:600; color:#e2e8f0; display:block; margin-bottom:6px;">Últimos Pagos Registrados:</span>
        <div id="listaPagosCliente" style="line-height:1.6;"></div>
      </div>

      <div class="quick-actions">
        <a id="linkRegistrarPago" href="pagos.html" class="btn-action btn-pay">
          + Registrar Pago a este Cliente
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { buscarClientePorDocumento } from './supabase.js';

    const form = document.getElementById('searchForm');
    const inputCedula = document.getElementById('cedula');
    const btnBuscar = document.getElementById('btnBuscar');
    const btnBuscarTexto = document.getElementById('btnBuscarTexto');
    const resultadoDiv = document.getElementById('resultado');
    const mensajeDiv = document.getElementById('mensajeEstado');

    // Auto-search if query param 'documento' exists
    const urlParams = new URLSearchParams(window.location.search);
    const docParam = urlParams.get('documento') || urlParams.get('cedula');
    if (docParam) {
      inputCedula.value = docParam;
      ejecutarBusqueda(docParam);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      ejecutarBusqueda(inputCedula.value.trim());
    });

    async function ejecutarBusqueda(doc) {
      if (!doc) return;

      btnBuscar.disabled = true;
      btnBuscarTexto.textContent = "Buscando...";
      mensajeDiv.style.display = "none";
      resultadoDiv.style.display = "none";

      try {
        const cliente = await buscarClientePorDocumento(doc);

        if (!cliente) {
          mensajeDiv.style.display = "block";
          mensajeDiv.style.backgroundColor = "#fee2e2";
          mensajeDiv.style.color = "#991b1b";
          mensajeDiv.style.border = "1px solid #f87171";
          mensajeDiv.innerHTML = `No se encontró ningún cliente con el documento <strong>${doc}</strong>. ¿Deseas <a href="registros.html" style="color:#2563eb; text-decoration:underline;">registrarlo ahora</a>?`;
          return;
        }

        // Renderizar datos del cliente
        document.getElementById('nombreCliente').textContent = cliente.nombre || 'Sin nombre';
        document.getElementById('documentoCliente').textContent = cliente.documento || doc;
        
        const estadoEl = document.getElementById('estadoCliente');
        estadoEl.innerHTML = `<span class="${cliente.estado === 'Activo' ? 'badge-active' : 'badge-inactive'}">${cliente.estado || 'Activo'}</span>`;

        document.getElementById('telefonoCliente').textContent = cliente.telefono || 'No registrado';

        const monto = Number(cliente.monto_deuda) || 0;
        const deudaEl = document.getElementById('deudaCliente');
        deudaEl.textContent = `$${monto.toLocaleString('es-CO')} COP`;
        deudaEl.className = monto > 0 ? "result-value debt" : "result-value";
        if (monto === 0) {
          deudaEl.style.color = "#10b981";
        }

        // Renderizar pagos recientes
        const listaPagos = document.getElementById('listaPagosCliente');
        if (cliente.ultimos_pagos && cliente.ultimos_pagos.length > 0) {
          listaPagos.innerHTML = cliente.ultimos_pagos.map(p => `
            <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed #334155;">
              <span>${p.fecha || 'Fecha N/A'} (${p.metodo_pago || 'Pago'})</span>
              <span style="font-weight:600; color:#10b981;">+$${Number(p.monto).toLocaleString('es-CO')}</span>
            </div>
          `).join('');
        } else {
          listaPagos.innerHTML = '<span style="color:#64748b;">No hay pagos registrados aún para este cliente.</span>';
        }

        // Configurar enlace de registrar pago rápido
        document.getElementById('linkRegistrarPago').href = `pagos.html?documento=${encodeURIComponent(cliente.documento)}&nombre=${encodeURIComponent(cliente.nombre)}`;

        resultadoDiv.style.display = "block";
      } catch (err) {
        console.error("Error en consulta:", err);
        mensajeDiv.style.display = "block";
        mensajeDiv.style.backgroundColor = "#fee2e2";
        mensajeDiv.style.color = "#991b1b";
        mensajeDiv.style.border = "1px solid #f87171";
        
        if (err.message && (err.message.includes("schema cache") || err.message.includes("Could not find the table"))) {
          mensajeDiv.innerHTML = "La tabla de clientes aún no está configurada en la base de datos. Ejecuta el archivo <code>schema.sql</code> en tu base de datos.";
        } else {
          mensajeDiv.textContent = "Error al consultar cliente: " + (err.message || err);
        }
      } finally {
        btnBuscar.disabled = false;
        btnBuscarTexto.textContent = "Buscar cliente";
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Previa - Consulta de Cliente</title>
  <link rel="stylesheet" href="estiloconsulta.css">
</head>
<body>

  <div class="card">
    
    <a href="menu2.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Inicio
    </a>

    
    <div class="card-header">
      <h2 class="card-title">Consulta de Cliente</h2>
      <p class="card-subtitle">Ingresa la cédula para verificar el estado de cuenta.</p>
    </div>

    
    <form id="searchForm" onsubmit="buscarCliente(event)">
      <div class="form-group">
        <label for="cedula">Cédula de Identidad</label>
        <input type="text" id="cedula" placeholder="Ej: 123456789" required autocomplete="off">
      </div>

      <button type="submit" class="btn-search">
        Buscar
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>

    <div id="resultado" class="result-container">
      <div class="result-item">
        <span class="result-label">Nombre del Cliente</span>
        <span id="nombreCliente" class="result-value">Juan Pérez</span>
      </div>
      <div class="result-item">
        <span class="result-label">Monto Adeudado</span>
        <span id="deudaCliente" class="result-value debt">$150.000 COP</span>
      </div>
    </div>
  </div>

  <script>
    function buscarCliente(event) {
      event.preventDefault();
      
     
      const resultadoDiv = document.getElementById('resultado');
      resultadoDiv.style.display = 'block';
    }
  </script>

</body>
</html>
